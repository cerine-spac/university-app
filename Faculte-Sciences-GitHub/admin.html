
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration - Faculté des Sciences</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">FS</div>

    <h2>Administration - Faculté des Sciences</h2>

    <nav>
        <a href="index.html">Accueil</a>
        <button id="logoutBtn" type="button">Déconnexion</button>
    </nav>
</header>

<main class="admin-container">

    <h1>Gestion des annonces</h1>

    <section class="admin-form">

        <h2 id="formTitle">Ajouter une annonce</h2>

        <form id="announcementForm">

            <label for="title">Titre :</label>
            <input
                type="text"
                id="title"
                placeholder="Titre de l'annonce"
                required
            >

            <label for="department">Département :</label>

            <select id="department" required>
                <option value="">Choisir un département</option>
                <option value="informatique">Informatique</option>
                <option value="biologie">Biologie</option>
                <option value="chimie">Chimie</option>
                <option value="agronomie">Agronomie</option>
                <option value="physique">Physique</option>
                <option value="mathematiques">Mathématiques</option>
            </select>

            <label for="content">Contenu :</label>

            <textarea
                id="content"
                rows="5"
                placeholder="Contenu de l'annonce..."
                required
            ></textarea>

            <button type="submit" id="submitBtn">
                Publier l'annonce
            </button>

            <button type="button" id="cancelEditBtn" hidden>
                Annuler la modification
            </button>

            <p id="formMessage"></p>

        </form>

    </section>

    <section class="admin-announcements">

        <h2>Liste des annonces</h2>

        <div id="announcementsList">
            Chargement des annonces...
        </div>

    </section>

</main>

<footer>
    <p>© 2026 Faculté des Sciences </p>
</footer>

<script src="admin.js"></script>

</body>
</html>
